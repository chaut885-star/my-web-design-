<!DOCTYPE html>
<html>
<head>

    <title>My 3D Website</title>

    <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f0e8;
            padding: 40px;
        }

        h1 {
            font-size: 45px;
        }

        p {
            font-size: 20px;
        }

        model-viewer {
            width: 100%;
            height: 500px;
            background: white;
            margin-top: 30px;
        }

        audio {
            margin-top: 30px;
        }
    </style>

</head>

<body>

    <h1>My 3D Design</h1>

    <p>
        This website shows my 3D model and audio.
    </p>

    <h2>My 3D Model</h2>

    <model-viewer
        src="model.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1">
    </model-viewer>

    <h2>My Audio</h2>

    <audio controls autoplay loop>
        <source src="audio.mp3.mp3" type="audio/mpeg">
    </audio>

</body>
</html>
