<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My 3D Design</title>

    <!-- MODEL VIEWER -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f0e8;
        }

        h1 {
            font-size: 48px;
            color: #222;
        }

        h2 {
            margin-top: 40px;
        }

        p {
            font-size: 20px;
        }

        model-viewer {
            width: 100%;
            height: 500px;
            margin: 30px auto;
            background-color: white;
        }

        audio {
            margin: 20px;
        }

    </style>

</head>


<body>

    <h1>My 3D Design</h1>

    <p>
        Welcome to my website. This is my 3D design project.
    </p>


    <h2>My 3D Model</h2>

    <model-viewer
        src="model.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1">
    </model-viewer>


    <h2>My Audio</h2>

    <audio id="myAudio" autoplay loop controls>
        <source src="audio.mp3.mp3" type="audio/mpeg">
    </audio>


    <script>

        const audio = document.getElementById("myAudio");

        // Try to start automatically
        window.addEventListener("load", function() {
            audio.play().catch(function() {
                console.log("Autoplay was blocked. Waiting for user interaction.");
            });
        });


        // Start audio after the first tap/click
        function startAudio() {
            audio.play().catch(function(error) {
                console.log("Audio could not start:", error);
            });

            document.removeEventListener("click", startAudio);
            document.removeEventListener("touchstart", startAudio);
        }

        document.addEventListener("click", startAudio);
        document.addEventListener("touchstart", startAudio);

    </script>


</body>

</html>
