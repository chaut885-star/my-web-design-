<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My 3D Design</title>

    <!-- MODEL VIEWER -->
    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        /* WHOLE PAGE */
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f0e8;
        }

        /* TITLE */
        h1 {
            font-size: 48px;
            color: #222;
        }

        /* TEXT */
        p {
            font-size: 20px;
        }

        /* 3D MODEL */
        model-viewer {
            width: 100%;
            height: 500px;
            margin: 30px auto;
            background-color: white;
        }

        /* AUDIO */
        audio {
            margin: 20px;
        }

    </style>

</head>


<body>

    <!-- WEBSITE TITLE -->
    <h1>My 3D Design</h1>


    <!-- DESCRIPTION -->
    <p>
        Welcome to my website. This is my 3D design project.
    </p>


    <!-- 3D MODEL SECTION -->
    <h2>My 3D Model</h2>

    <model-viewer
        src="model.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1">
    </model-viewer>


    <!-- AUDIO SECTION -->
    <h2>My Audio</h2>

    <audio autoplay loop controls>
        <source src="audio.mp3.mp3" type="audio/mpeg">
    </audio>


</body>

</html>
